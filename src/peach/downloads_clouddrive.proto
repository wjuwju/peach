// CloudDrive2 gRPC 接口的子集：云下载与网盘代理配置。
//
// 字段号、类型与名字逐个照抄官方 https://www.clouddrive2.com/api/clouddrive.proto
// （option version = "1.1.2"）。未声明字段由 protobuf 保留，读改写配置时一并回传。
// 服务端多给的那些照常读得进来。改动后重新生成 `downloads_clouddrive_pb2.py`：
//
//   uvx --from grpcio-tools==1.84.0 python -m grpc_tools.protoc -Isrc/peach
//       --python_out=src/peach src/peach/downloads_clouddrive.proto
syntax = "proto3";

package clouddrive;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service CloudDriveFileSrv {
  rpc GetSystemInfo(google.protobuf.Empty) returns (CloudDriveSystemInfo) {}
  rpc GetApiTokenInfo(StringValue) returns (TokenInfo) {}
  rpc GetAllCloudApis(google.protobuf.Empty) returns (CloudAPIList) {}
  rpc GetCloudAPIConfig(GetCloudAPIConfigRequest) returns (CloudAPIConfig) {}
  rpc SetCloudAPIConfig(SetCloudAPIConfigRequest) returns (google.protobuf.Empty) {}
  rpc GetMountPoints(google.protobuf.Empty) returns (GetMountPointsResult) {}
  rpc FindFileByPath(FindFileByPathRequest) returns (CloudDriveFile) {}
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResult) {}
  rpc AddOfflineFiles(AddOfflineFileRequest) returns (FileOperationResult) {}
  rpc RemoveOfflineFiles(RemoveOfflineFilesRequest) returns (FileOperationResult) {}
  rpc ListOfflineFilesByPath(FileRequest) returns (OfflineFileListResult) {}
  rpc GetOfflineQuotaInfo(OfflineQuotaRequest) returns (OfflineQuotaInfo) {}
  rpc GetSubFiles(ListSubFileRequest) returns (stream SubFilesReply) {}
  rpc GetDownloadUrlPath(GetDownloadUrlPathRequest) returns (DownloadUrlPathInfo) {}
  rpc RenameFile(RenameFileRequest) returns (FileOperationResult) {}
  rpc MoveFile(MoveFileRequest) returns (FileOperationResult) {}
  rpc DeleteFile(FileRequest) returns (FileOperationResult) {}
  rpc CreateFile(CreateFileRequest) returns (CreateFileResult) {}
  rpc WriteToFile(WriteFileRequest) returns (WriteFileResult) {}
  rpc CloseFile(CloseFileRequest) returns (FileOperationResult) {}
}

message CloudDriveSystemInfo {
  bool IsLogin = 1;
  string UserName = 2;
  bool SystemReady = 3;
}

message StringValue { string value = 1; }

message TokenInfo {
  string token = 1;
  string rootDir = 2;
  TokenPermissions permissions = 3;
  optional uint64 expires_in = 4;
  string friendly_name = 5;
}

message TokenPermissions {
  bool allow_list = 1;
  bool allow_add_offline_download = 16;
  bool allow_list_offline_downloads = 17;
  bool allow_modify_offline_downloads = 18;
  bool allow_get_mounts = 25;
  bool allow_get_cloud_apis = 29;
  bool allow_modify_cloud_apis = 30;
}

enum ProxyType { SYSTEM = 0; NOPROXY = 1; HTTP = 2; SOCKS5 = 3; }
message ProxyInfo {
  ProxyType proxyType = 1;
  string host = 2;
  uint32 port = 3;
  optional string username = 4;
  optional string password = 5;
}
message GetCloudAPIConfigRequest { string cloudName = 1; string userName = 2; }
message CloudAPIList { repeated CloudAPI apis = 1; }
message CloudAPIConfig {
  uint32 maxDownloadThreads = 1;
  uint64 minReadLengthKB = 2;
  uint64 maxReadLengthKB = 3;
  uint64 defaultReadLengthKB = 4;
  uint64 maxBufferPoolSizeMB = 5;
  double maxQueriesPerSecond = 6;
  bool forceIpv4 = 7;
  optional ProxyInfo apiProxy = 8;
  optional ProxyInfo dataProxy = 9;
}
message SetCloudAPIConfigRequest {
  string cloudName = 1;
  string userName = 2;
  CloudAPIConfig config = 3;
}
message MountPoint {
  string mountPoint = 1;
  string sourceDir = 2;
  bool localMount = 3;
  bool isMounted = 9;
}
message GetMountPointsResult { repeated MountPoint mountPoints = 1; }

message FindFileByPathRequest {
  string parentPath = 1;
  string path = 2;
}

message CloudAPI {
  string name = 1;
  string userName = 2;
  string nickName = 3;
  optional string path = 10;
}

message CloudDriveFile {
  string id = 1;
  string name = 2;
  string fullPathName = 3;
  int64 size = 4;
  google.protobuf.Timestamp writeTime = 7;
  CloudAPI CloudAPI = 9;
  bool isDirectory = 30;
  bool isCloudRoot = 32;
  bool canOfflineDownload = 66;
  bool supportOfflineDownloadManagement = 75;
}

message ListSubFileRequest { string path = 1; bool forceRefresh = 2; optional bool checkExpires = 3; }
message SubFilesReply { repeated CloudDriveFile subFiles = 1; }
message GetDownloadUrlPathRequest { string path = 1; bool preview = 2; bool lazy_read = 3; bool get_direct_url = 4; }
message DownloadUrlPathInfo {
  string downloadUrlPath = 1; optional uint64 expiresIn = 2; optional string directUrl = 3;
  optional string userAgent = 4; map<string, string> additionalHeaders = 5;
}
message RenameFileRequest { string theFilePath = 1; string newName = 2; }
message MoveFileRequest {
  enum ConflictPolicy { Overwrite = 0; Rename = 1; Skip = 2; }
  repeated string theFilePaths = 1; string destPath = 2;
  optional ConflictPolicy conflictPolicy = 3; optional bool moveAcrossClouds = 4;
}
message CreateFileRequest { string parentPath = 1; string fileName = 2; }
message CreateFileResult { uint64 fileHandle = 1; }
message CloseFileRequest { uint64 fileHandle = 1; optional bool uploadImmediately = 2; }
message WriteFileRequest {
  uint64 fileHandle = 1; uint64 startPos = 2; uint64 length = 3;
  bytes buffer = 4; bool closeFile = 5; optional bool uploadImmediately = 6;
}
message WriteFileResult { uint64 bytesWritten = 1; }

message CreateFolderRequest {
  string parentPath = 1;
  string folderName = 2;
}

message CreateFolderResult {
  CloudDriveFile folderCreated = 1;
  FileOperationResult result = 2;
}

message AddOfflineFileRequest {
  string urls = 1;
  string toFolder = 2;
  optional uint64 checkFolderAfterSecs = 3;
}

message FileOperationResult {
  bool success = 1;
  string errorMessage = 2;
  repeated string resultFilePaths = 3;
}

message RemoveOfflineFilesRequest {
  string cloudName = 1;
  string cloudAccountId = 2;
  bool deleteFiles = 3;
  repeated string infoHashes = 4;
  optional string path = 5;
}

message FileRequest {
  string path = 1;
  optional bool forceRefresh = 2;
}

enum OfflineFileStatus {
  OFFLINE_INIT = 0;
  OFFLINE_DOWNLOADING = 1;
  OFFLINE_FINISHED = 2;
  OFFLINE_ERROR = 3;
  OFFLINE_UNKNOWN = 4;
}

message OfflineFile {
  string name = 1;
  uint64 size = 2;
  string url = 3;
  OfflineFileStatus status = 4;
  string infoHash = 5;
  string fileId = 6;
  uint64 add_time = 7;
  string parentId = 8;
  double percendDone = 9;
  uint64 peers = 10;
}

message OfflineStatus {
  uint32 quota = 1;
  uint32 total = 2;
}

message OfflineFileListResult {
  repeated OfflineFile offlineFiles = 1;
  OfflineStatus status = 2;
}

message OfflineQuotaRequest {
  string cloudName = 1;
  string cloudAccountId = 2;
  optional string path = 3;
}

message OfflineQuotaInfo {
  int32 total = 1;
  int32 used = 2;
  int32 left = 3;
}
